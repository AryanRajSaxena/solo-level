# Netlify Configuration for Solo Leveling Quest
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "cd artifacts/solo-leveling-quest && npx expo export -p web"
  publish = "artifacts/solo-leveling-quest/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Routing: Redirect all routes to index.html for Expo Router client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional Reverse Proxy to FastAPI Backend:
# If you deploy your backend to Render/Railway, uncomment and set your backend URL here.
# Requests to https://<your-site>.netlify.app/api/* will be transparently forwarded,
# eliminating any CORS issues.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# HTTP Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
