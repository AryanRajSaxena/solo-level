# Netlify Configuration for Solo Leveling Quest (Project-level)

[build]
  command = "cd artifacts/solo-leveling-quest 2>/dev/null || true; npx expo export -p web"
  publish = "artifacts/solo-leveling-quest/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
